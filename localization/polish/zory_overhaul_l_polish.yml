 zory_baron_victory:0 "Triumf Barona"
 zory_baron_victory_desc:0 "Ruch żorski i inteligencja obu państw przyjmują doktrynę leseferyzmu Barona."
 ideology_krawczykism:0 "Krawczykizm"
 ideology_krawczykism_desc:0 "#lore Interwencjonizm, państwowe szkolnictwo i konserwatywne spojrzenie na porządek społeczny.#!"
 ideology_baronism:0 "Baronowska"
 ideology_baronism_desc:0 "#lore Leseferyzm, agraryzm, religia państwowa oraz sprzeciw wobec obowiązkowego szkolnictwa i emancypacji kobiet.#!"
 ideology_zory_economic_school:0 "Żorska"
 ideology_zory_economic_school_desc:0 "#lore Przejściowa synteza żorskich doktryn, której ostateczny program rozstrzygnie międzynarodowa debata.#!"
 movement_zory_economic_school:0 "Żorska Szkoła Ekonomii"
