 zory_events.1.t:0 "Wielka debata żorska"
 zory_events.1.d:0 "Uczestnicy Żorskiej Szkoły Ekonomii spierają się o przyszłość gospodarki Polski i Ukrainy."
 zory_events.1.f:0 "Po sześciu godzinach dyskusji ustalono wyłącznie, że przeciwnik nie rozumie podstaw ekonomii."
 zory_events.1.a:0 "Rynek potrzebuje rozumnego państwa."
 zory_events.1.b:0 "Niewidzialna ręka rynku wystarczy."
 zory_events.1.c:0 "Panowie, to miała być przerwa obiadowa."
 zory_events.2.t:0 "Triumf Krawczyka"
 zory_events.2.d:0 "Doktryna Krawczyka zyskała przewagę w debacie ekonomicznej."
 zory_events.2.f:0 "Niewidzialna ręka rynku potrzebowała widzialnego urzędnika."
 zory_events.2.a:0 "Państwo wie lepiej."
 zory_events.3.t:0 "Triumf Barona"
 zory_events.3.d:0 "Doktryna Barona triumfuje po latach sporów."
 zory_events.3.f:0 "Komisję do spraw deregulacji rozwiązano przed powołaniem podkomisji."
 zory_events.3.a:0 "Laissez faire, laissez passer!"
 zory_events.4.t:0 "Przybycie von Krawczyka"
 zory_events.4.d:0 "Do Polski przybywa von Krawczyk, agitator Żorskiej Szkoły Ekonomii."
 zory_events.4.f:0 "Jeżeli rynek działa prawidłowo, należy go uregulować, aby działał jeszcze lepiej."
 zory_events.4.a:0 "Niech rozpocznie działalność!"
