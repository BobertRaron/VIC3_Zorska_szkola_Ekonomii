 je_zory_economic_school:0 "Żorska Szkoła Ekonomii"
 je_zory_economic_school_reason:0 "Nad Europą Wschodnią zawisło widmo ekonomii żorskiej. W Polsce zwolennicy Krawczyka głoszą interwencjonizm, podczas gdy na Ukrainie rozwija się baronowski leseferyzm. Obie szkoły pozostają przekonane o własnej nieomylności."
 zory_economic_school_progress:0 "Wielki Spór Żorski"
 zory_economic_school_progress_desc:0 "Niskie wartości oznaczają przewagę Krawczyka; wysokie przewagę Barona."
 zory_krawczyk_side:0 "Krawczykizm"
 zory_baron_side:0 "Baronizm"
 zory_krawczyk_victory:0 "Triumf Krawczyka"
