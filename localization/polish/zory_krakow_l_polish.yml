l_polish:
 zory_krakow.1.t:0 "Krakowski zryw narodowy"
 zory_krakow.1.d:0 "Rozbudzone poczucie wspólnoty narodowej zamieniło krakowskie ulice w arenę wielkiej manifestacji. Uczeni, studenci, mieszczanie i żołnierze ogłaszają, że ziemie polskie pod panowaniem Habsburgów powinny zostać zjednoczone pod jednym sztandarem. W Wiedniu mówi się o buncie, w Krakowie — o dziejowej sprawiedliwości."
 zory_krakow.1.f:0 "»Nie pytaliśmy Wiednia o pozwolenie na bycie Polakami — i nie będziemy pytać o pozwolenie na własną ojczyznę.«"
 zory_krakow.1.a:0 "Niech ziemie polskie powrócą do Krakowa!"
 zory_krakow.1.b:0 "Nie jesteśmy gotowi rzucić wyzwania Habsburgom."

 zory_krakow.2.t:0 "Kraków wzywa Polskę Kongresową"
 zory_krakow.2.d:0 "Kraków wzywa Polskę Kongresową do obrony ziem polskich przed Austrią. Decyzja o pomocy może zostać podjęta tylko wtedy, gdy zarówno Polska, jak i Ukraina są niepodległymi państwami, zdolnymi samodzielnie prowadzić politykę zagraniczną."
 zory_krakow.2.f:0 "»Dziś ważą się losy Krakowa; jutro ważyć mogą się losy całej Polski.«"
 zory_krakow.2.a:0 "Polska stanie u boku Krakowa!"
 zory_krakow.2.b:0 "Nie możemy narazić naszego państwa."

 zory_krakow.3.t:0 "Ukraińska odpowiedź na kryzys krakowski"
 zory_krakow.3.d:0 "Kraków zwraca się do Ukrainy z prośbą o wsparcie przeciw Austrii. Warunkiem udziału w tym sporze jest niepodległość zarówno Ukrainy, jak i Polski Kongresowej. Rosja nie zostanie automatycznie wciągnięta do konfliktu."
 zory_krakow.3.f:0 "W Kijowie zauważono, że wszelki niepokój w Wiedniu daje sposobność do przeliczenia własnych dywizji."
 zory_krakow.3.a:0 "Ukraina poprze krakowski zryw!"
 zory_krakow.3.b:0 "Pozostańmy neutralni."

 zory_krakow.4.t:0 "Ultimatum Wiednia"
 zory_krakow.4.d:0 "Cesarz Austrii uznał przejęcie ziem polskich przez Kraków za akt jawnej rebelii. Wiedeń zażądał bezwarunkowego podporządkowania miasta i jego aneksji. Niespełnienie ultimatum doprowadzi do otwartego konfliktu dyplomatycznego, który może przerodzić się w wojnę."
 zory_krakow.4.f:0 "W kancelarii cesarskiej napisano: »Kraków należy przywrócić do porządku«. W Krakowie odczytano to jako wypowiedzenie wojny."
 zory_krakow.4.a:0 "Niech Europa osądzi ten spór!"

 zory_krakow.5.t:0 "Od Krakowa ku zjednoczeniu"
 zory_krakow.5.d:0 "Austria poniosła klęskę, a krakowskie powstanie osiągnęło swój cel. Sukces oręża i współpracy polskich środowisk politycznych otwiera nowy rozdział historii: ziemie opanowane przez Kraków zostają włączone do Polski Kongresowej, której państwowość rozszerza się na zachód."
 zory_krakow.5.f:0 "»Niech Kraków nie będzie już symbolem rozbicia, lecz pierwszym kamieniem nowej całości.«"
 zory_krakow.5.a:0 "Niech żyje zjednoczona Polska!"

 zory_krakow.6.t:0 "Niedokończony zryw"
 zory_krakow.6.d:0 "Wojna między Austrią a Krakowem dobiegła końca bez bezspornego zwycięstwa krakowskiej sprawy. Los przejętych ziem pozostaje zależny od warunków pokoju. Plan natychmiastowego przyłączenia Krakowa do Polski Kongresowej został odłożony."
 zory_krakow.6.f:0 "Wielkie idee historyczne nie zawsze kończą się wielkimi traktatami."
 zory_krakow.6.a:0 "Historia jeszcze nie powiedziała ostatniego słowa."

 dp_zory_krakow_annex:0 "Austriackie ultimatum wobec Krakowa"
